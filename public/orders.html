<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Orders — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar" id="navbar"></nav>
  </header>

  <main class="page-wrapper">
    <div class="container">
      <div class="flex-between mb-3">
        <h1>My Orders</h1>
        <a href="/products.html" class="btn btn-secondary btn-sm">Continue Shopping</a>
      </div>

      <!-- Status filter -->
      <div style="display: flex; gap: 0.5rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
        <button class="btn btn-sm btn-primary" id="filter-all" onclick="setStatusFilter('')">All</button>
        <button class="btn btn-sm btn-ghost" id="filter-confirmed" onclick="setStatusFilter('confirmed')">Confirmed</button>
        <button class="btn btn-sm btn-ghost" id="filter-shipped" onclick="setStatusFilter('shipped')">Shipped</button>
        <button class="btn btn-sm btn-ghost" id="filter-delivered" onclick="setStatusFilter('delivered')">Delivered</button>
      </div>

      <div id="orders-content">
        <div class="flex-center" style="padding: 4rem;">
          <div class="spinner"></div>
        </div>
      </div>

      <div id="pagination" class="pagination"></div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopSmart. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    renderNavbar();
    requireAuth();

    let currentPage = 1;
    let currentStatus = '';

    function setStatusFilter(status) {
      currentStatus = status;
      currentPage = 1;

      document.querySelectorAll('[id^="filter-"]').forEach(btn => btn.className = 'btn btn-sm btn-ghost');
      const activeId = 'filter-' + (status || 'all');
      const activeBtn = document.getElementById(activeId);
      if (activeBtn) activeBtn.className = 'btn btn-sm btn-primary';

      loadOrders();
    }

    async function loadOrders() {
      const content = document.getElementById('orders-content');
      content.innerHTML = '<div class="flex-center" style="padding: 4rem;"><div class="spinner"></div></div>';

      const params = new URLSearchParams({ page: currentPage, limit: 10 });
      if (currentStatus) params.set('status', currentStatus);

      const { status, data } = await apiRequest('GET', '/orders?' + params.toString(), null, true);

      if (status === 401) { window.location.href = '/login.html'; return; }

      if (status !== 200 || !data.data) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Failed to load orders</h3></div>`;
        return;
      }

      const { orders, pagination } = data.data;

      // Note: BUG-007 in the API means the most recent order is missing from this list.
      // Students may notice their newest order doesn't appear here immediately after placing it.

      if (orders.length === 0) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">📦</div>
            <h3>No orders found</h3>
            <p>${currentStatus ? 'No orders with status "' + currentStatus + '".' : "You haven't placed any orders yet."}</p>
            <a href="/products.html" class="btn btn-primary">Start Shopping</a>
          </div>
        `;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      const rows = orders.map(order => `
        <tr>
          <td><span style="font-family: monospace; font-size: 0.8rem;">#${order.id.substring(0, 8).toUpperCase()}</span></td>
          <td>${formatDate(order.createdAt)}</td>
          <td><span class="status-badge status-${order.status}">${order.status}</span></td>
          <td>${order.itemCount} item${order.itemCount !== 1 ? 's' : ''}</td>
          <td>${formatPrice(order.total)}</td>
          <td>
            <a href="/order-detail.html?orderId=${order.id}" class="btn btn-secondary btn-sm">View</a>
          </td>
        </tr>
      `).join('');

      content.innerHTML = `
        <div class="card" style="padding: 0; overflow: hidden;">
          <table class="orders-table">
            <thead>
              <tr>
                <th>Order #</th>
                <th>Date</th>
                <th>Status</th>
                <th>Items</th>
                <th>Total</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
      `;

      renderPagination(pagination);
    }

    function renderPagination(pagination) {
      const container = document.getElementById('pagination');
      if (pagination.totalPages <= 1) { container.innerHTML = ''; return; }

      let html = '';
      html += `<button class="page-btn" onclick="goToPage(${pagination.page - 1})" ${!pagination.hasPrev ? 'disabled' : ''}>&#8249;</button>`;
      for (let i = 1; i <= pagination.totalPages; i++) {
        html += `<button class="page-btn ${i === pagination.page ? 'active' : ''}" onclick="goToPage(${i})">${i}</button>`;
      }
      html += `<button class="page-btn" onclick="goToPage(${pagination.page + 1})" ${!pagination.hasNext ? 'disabled' : ''}>&#8250;</button>`;
      container.innerHTML = html;
    }

    function goToPage(page) {
      currentPage = page;
      loadOrders();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    loadOrders();
  </script>
</body>
</html>
