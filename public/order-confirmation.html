<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar" id="navbar"></nav>
  </header>

  <main class="page-wrapper">
    <div class="container" style="max-width: 720px;">
      <div id="confirmation-content">
        <div class="flex-center" style="padding: 4rem;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopSmart. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    renderNavbar();
    requireAuth();

    const orderId = getQueryParam('orderId');

    if (!orderId) {
      document.getElementById('confirmation-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h3>Order not found</h3>
          <a href="/products.html" class="btn btn-primary">Continue Shopping</a>
        </div>
      `;
    } else {
      loadOrder();
    }

    async function loadOrder() {
      const content = document.getElementById('confirmation-content');
      const { status, data } = await apiRequest('GET', '/orders/' + orderId, null, true);

      if (status === 404) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Order not found</h3>
            <a href="/orders.html" class="btn btn-primary">View All Orders</a>
          </div>
        `;
        return;
      }

      if (status !== 200 || !data.data) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Failed to load order</h3></div>`;
        return;
      }

      const order = data.data.order;
      const addr = order.shippingAddress || {};

      const itemRows = order.items.map(item => `
        <tr>
          <td>${item.productName}</td>
          <td>${item.quantity}</td>
          <td>${formatPrice(item.unitPrice)}</td>
          <td>${formatPrice(item.lineTotal)}</td>
        </tr>
      `).join('');

      const addressText = addr.address1
        ? `${addr.firstName || ''} ${addr.lastName || ''}<br/>${addr.address1}${addr.address2 ? ', ' + addr.address2 : ''}<br/>${addr.city || ''}, ${addr.state || ''} ${addr.zip || ''}<br/>${addr.country || ''}`
        : '<em class="text-muted">No address provided</em>';

      content.innerHTML = `
        <div class="confirmation-header">
          <div class="confirmation-icon">✓</div>
          <h1>Order Confirmed!</h1>
          <p class="text-muted">Thank you for your purchase. Your order has been placed successfully.</p>
        </div>

        <div class="card" style="margin-top: 1.5rem;">
          <div class="flex-between mb-2">
            <div>
              <div class="text-muted" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Order Number</div>
              <div class="fw-600" style="font-size: 0.95rem;">#${order.id.substring(0, 8).toUpperCase()}</div>
            </div>
            <div style="text-align: right;">
              <div class="text-muted" style="font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em;">Date</div>
              <div class="fw-600" style="font-size: 0.95rem;">${formatDate(order.createdAt)}</div>
            </div>
            <div>
              <span class="status-badge status-${order.status}">${order.status}</span>
            </div>
          </div>

          <hr class="divider" />

          <h4 style="margin-bottom: 1rem;">Items Ordered</h4>
          <table class="order-items-table">
            <thead>
              <tr>
                <th>Product</th>
                <th>Qty</th>
                <th>Unit Price</th>
                <th>Total</th>
              </tr>
            </thead>
            <tbody>
              ${itemRows}
            </tbody>
          </table>

          <hr class="divider" />

          <div class="order-detail-grid" style="margin-top: 0;">
            <div>
              <h4 style="margin-bottom: 0.75rem;">Shipping Address</h4>
              <p style="font-size: 0.875rem; line-height: 1.8;">${addressText}</p>
            </div>
            <div>
              <h4 style="margin-bottom: 0.75rem;">Order Total</h4>
              <div class="summary-line">
                <span class="text-muted">Subtotal</span>
                <span>${formatPrice(order.subtotal)}</span>
              </div>
              <div class="summary-line">
                <span class="text-muted">Shipping</span>
                <span>${formatPrice(order.shipping)}</span>
              </div>
              <div class="summary-line total">
                <span>Total</span>
                <span>${formatPrice(order.total)}</span>
              </div>
            </div>
          </div>
        </div>

        <div class="flex-center gap-2 mt-3">
          <a href="/products.html" class="btn btn-secondary">Continue Shopping</a>
          <a href="/orders.html" class="btn btn-primary">View Order History</a>
        </div>
      `;

      updateCartCount();
    }

    loadOrder();
  </script>
</body>
</html>
