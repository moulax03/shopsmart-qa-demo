<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/index.html">Shop<span>Smart</span></a>
      </div>
      <h1 class="auth-title">Create an account</h1>
      <p class="auth-subtitle">Join ShopSmart and start shopping today.</p>

      <div id="signup-alert" class="alert hidden"></div>

      <form id="signup-form" novalidate>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="firstName">First Name <span class="required">*</span></label>
            <input type="text" id="firstName" name="firstName" class="form-control" placeholder="John" autocomplete="given-name" />
            <span class="form-error" id="firstName-error"></span>
          </div>
          <div class="form-group">
            <label class="form-label" for="lastName">Last Name <span class="required">*</span></label>
            <input type="text" id="lastName" name="lastName" class="form-control" placeholder="Doe" autocomplete="family-name" />
            <span class="form-error" id="lastName-error"></span>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" autocomplete="email" />
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 special" autocomplete="new-password" />
          <span class="form-error" id="password-error"></span>
          <span class="form-hint">At least 8 characters with 1 uppercase, 1 number, and 1 special character.</span>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm Password <span class="required">*</span></label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Re-enter your password" autocomplete="new-password" />
          <span class="form-error" id="confirmPassword-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="signup-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a href="/login.html">Sign in</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn('/products.html');

    const FIELD_MAP = {
      firstName: 'firstName-error',
      lastName: 'lastName-error',
      email: 'email-error',
      password: 'password-error',
      confirmPassword: 'confirmPassword-error'
    };

    // Real-time validation on blur
    document.getElementById('firstName').addEventListener('blur', () => validateFirstName());
    document.getElementById('lastName').addEventListener('blur', () => validateLastName());
    document.getElementById('email').addEventListener('blur', () => validateEmailField());
    document.getElementById('password').addEventListener('blur', () => validatePasswordField());
    document.getElementById('confirmPassword').addEventListener('blur', () => validateConfirmPassword());

    function validateFirstName() {
      const val = document.getElementById('firstName').value.trim();
      if (!val || val.length < 2 || val.length > 50 || !/^[a-zA-Z\s\-']+$/.test(val)) {
        setFieldError('firstName', 'firstName-error', 'First name must be 2-50 characters (letters, spaces, hyphens, apostrophes only).');
        return false;
      }
      clearFieldError('firstName', 'firstName-error');
      return true;
    }

    function validateLastName() {
      const val = document.getElementById('lastName').value.trim();
      if (!val || val.length < 2 || val.length > 50 || !/^[a-zA-Z\s\-']+$/.test(val)) {
        setFieldError('lastName', 'lastName-error', 'Last name must be 2-50 characters (letters, spaces, hyphens, apostrophes only).');
        return false;
      }
      clearFieldError('lastName', 'lastName-error');
      return true;
    }

    function validateEmailField() {
      const val = document.getElementById('email').value.trim();
      if (!val || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(val)) {
        setFieldError('email', 'email-error', 'Please enter a valid email address.');
        return false;
      }
      clearFieldError('email', 'email-error');
      return true;
    }

    function validatePasswordField() {
      const val = document.getElementById('password').value;
      if (!val || val.length < 8 || !/[A-Z]/.test(val) || !/[0-9]/.test(val) || !/[^a-zA-Z0-9]/.test(val)) {
        setFieldError('password', 'password-error', 'Password must be at least 8 characters with 1 uppercase, 1 digit, and 1 special character.');
        return false;
      }
      clearFieldError('password', 'password-error');
      return true;
    }

    function validateConfirmPassword() {
      const pw = document.getElementById('password').value;
      const cpw = document.getElementById('confirmPassword').value;
      if (!cpw || pw !== cpw) {
        setFieldError('confirmPassword', 'confirmPassword-error', 'Passwords do not match.');
        return false;
      }
      clearFieldError('confirmPassword', 'confirmPassword-error');
      return true;
    }

    document.getElementById('signup-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      // Run all validations
      const valid = validateFirstName() & validateLastName() & validateEmailField() & validatePasswordField() & validateConfirmPassword();
      if (!valid) return;

      const btn = document.getElementById('signup-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Creating Account...';

      const alert = document.getElementById('signup-alert');
      alert.className = 'alert hidden';

      const body = {
        firstName: document.getElementById('firstName').value.trim(),
        lastName: document.getElementById('lastName').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        confirmPassword: document.getElementById('confirmPassword').value
      };

      const { status, data } = await apiRequest('POST', '/auth/signup', body);

      btn.disabled = false;
      btn.textContent = 'Create Account';

      if (status === 201) {
        alert.className = 'alert alert-success';
        alert.textContent = 'Account created! Redirecting to sign in...';
        alert.classList.remove('hidden');
        setTimeout(() => { window.location.href = '/login.html'; }, 1500);
        return;
      }

      if (status === 409) {
        // BUG-010: On duplicate email (409), the form is silently cleared with NO error message shown.
        // A correct implementation would display: "An account with this email already exists."
        // Instead, we just reset the form entirely without any user feedback.
        document.getElementById('signup-form').reset();
        // Intentionally: do NOT show any error, do NOT highlight the email field.
        return;
      }

      if (status === 400 && data.errors) {
        // Show field-level validation errors from API
        for (const [field, message] of Object.entries(data.errors)) {
          const inputId = field;
          const errorId = field + '-error';
          setFieldError(inputId, errorId, message);
        }
        return;
      }

      // Generic error
      alert.className = 'alert alert-error';
      alert.textContent = data.message || 'An error occurred. Please try again.';
      alert.classList.remove('hidden');
    });
  </script>
</body>
</html>
