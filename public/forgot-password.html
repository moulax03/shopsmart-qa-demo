<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/index.html">Shop<span>Smart</span></a>
      </div>
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Enter your email and we'll send you a reset link.</p>

      <div id="fp-success" class="alert alert-success hidden"></div>

      <form id="fp-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address</label>
          <input type="text" id="email" name="email" class="form-control" placeholder="Enter your email" autocomplete="email" />
          <span class="form-error" id="email-error"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="fp-btn">Send Reset Link</button>
      </form>

      <div class="auth-footer">
        <a href="/login.html">Back to Sign In</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    document.getElementById('fp-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value;
      const btn = document.getElementById('fp-btn');
      const successDiv = document.getElementById('fp-success');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Sending...';

      // BUG-002: The API accepts any input (no validation), always returns 200.
      // The frontend shows the success message for any response, matching the API behavior.
      const { status, data } = await apiRequest('POST', '/auth/forgot-password', { email });

      btn.disabled = false;
      btn.textContent = 'Send Reset Link';

      // Always show the success message (BUG-002: API always returns 200 for any input)
      successDiv.textContent = 'If this email exists in our system, a reset link has been sent.';
      successDiv.classList.remove('hidden');
      document.getElementById('fp-form').style.display = 'none';
    });
  </script>
</body>
</html>
