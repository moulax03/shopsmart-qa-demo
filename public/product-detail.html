<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar" id="navbar"></nav>
  </header>

  <main class="page-wrapper">
    <div class="container">
      <div class="breadcrumb">
        <a href="/index.html">Home</a>
        <span>/</span>
        <a href="/products.html">Products</a>
        <span>/</span>
        <span id="breadcrumb-name">Loading...</span>
      </div>

      <div id="product-content">
        <div class="flex-center" style="padding: 4rem;">
          <div class="spinner"></div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopSmart. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    renderNavbar();

    const productId = getQueryParam('id');

    if (!productId) {
      document.getElementById('product-content').innerHTML = `
        <div class="empty-state">
          <div class="empty-icon">⚠️</div>
          <h3>Product not found</h3>
          <p>No product ID was provided.</p>
          <a href="/products.html" class="btn btn-primary">Browse Products</a>
        </div>
      `;
    } else {
      loadProduct();
    }

    async function loadProduct() {
      const { status, data } = await apiRequest('GET', '/products/' + productId);
      const content = document.getElementById('product-content');

      if (status === 404) {
        content.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">🔍</div>
            <h3>Product not found</h3>
            <p>The product you're looking for doesn't exist or has been removed.</p>
            <a href="/products.html" class="btn btn-primary">Browse Products</a>
          </div>
        `;
        return;
      }

      if (status !== 200 || !data.data) {
        content.innerHTML = `<div class="empty-state"><div class="empty-icon">⚠️</div><h3>Failed to load product</h3></div>`;
        return;
      }

      const p = data.data.product;
      document.title = `${p.name} — ShopSmart`;
      document.getElementById('breadcrumb-name').textContent = p.name;

      const priceClass = p.price < 0 ? 'price-negative' : '';

      // BUG-011: Always display stockCount as a number even when 0.
      // Never show "Out of Stock" badge; Add to Cart button is always enabled.
      content.innerHTML = `
        <div class="product-detail">
          <div>
            <img src="${p.imageUrl}" alt="${p.name}" class="product-detail-image" />
          </div>
          <div class="product-detail-info">
            <div class="product-detail-meta">
              <span class="category-badge">${p.category}</span>
              <!-- BUG-011: Out of Stock badge intentionally omitted even when stockCount === 0 -->
            </div>
            <h1>${p.name}</h1>
            <div class="product-card-rating" style="margin-top: 0.5rem;">
              <span class="stars">${renderStars(p.rating)}</span>
              <span>${p.rating} (${p.reviewCount} reviews)</span>
            </div>
            <div class="product-detail-price ${priceClass}">${formatPrice(p.price)}</div>
            <p class="product-detail-desc">${p.description}</p>

            <div style="background: var(--bg); border-radius: var(--radius); padding: 0.75rem 1rem; margin-bottom: 1.25rem; font-size: 0.875rem;">
              <!-- BUG-011: Shows numeric stock count instead of "Out of Stock" badge -->
              <span style="color: var(--text-muted);">In Stock:</span>
              <strong style="color: var(--text); margin-left: 0.4rem;">${p.stockCount} available</strong>
            </div>

            <div class="quantity-selector">
              <label for="quantity">Quantity:</label>
              <input type="number" id="quantity" class="qty-input" value="1" min="1" max="${Math.max(p.stockCount, 99)}" />
            </div>

            <!-- BUG-011: Button is always enabled regardless of stockCount -->
            <button class="btn btn-primary btn-lg btn-full" id="add-to-cart-btn" onclick="addToCart('${p.id}')">
              Add to Cart
            </button>

            <div class="product-sku">SKU: ${p.sku}</div>
          </div>
        </div>
      `;
    }

    async function addToCart(productId) {
      if (!isLoggedIn()) {
        window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }

      const qty = parseInt(document.getElementById('quantity').value) || 1;
      const btn = document.getElementById('add-to-cart-btn');

      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Adding...';

      const { status, data } = await apiRequest('POST', '/cart/items', { productId, quantity: qty }, true);

      btn.disabled = false;
      btn.textContent = 'Add to Cart';

      if (status === 200) {
        showToast('Added to cart!', 'success');
        updateCartCount();
        return;
      }

      if (status === 401) {
        window.location.href = '/login.html?redirect=' + encodeURIComponent(window.location.pathname + window.location.search);
        return;
      }

      showToast(data.message || 'Failed to add to cart.', 'error');
    }
  </script>
</body>
</html>
