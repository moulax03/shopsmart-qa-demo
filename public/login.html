<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">
      <div class="auth-logo">
        <a href="/index.html">Shop<span>Smart</span></a>
      </div>
      <h1 class="auth-title">Welcome back</h1>
      <p class="auth-subtitle">Sign in to your ShopSmart account.</p>

      <div id="login-alert" class="alert hidden"></div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email Address <span class="required">*</span></label>
          <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com" autocomplete="email" />
          <span class="form-error" id="email-error"></span>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password <span class="required">*</span></label>
          <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" />
          <span class="form-error" id="password-error"></span>
        </div>

        <div class="flex-between mb-2">
          <div class="checkbox-group">
            <input type="checkbox" id="remember-me" />
            <label for="remember-me">Remember me</label>
          </div>
          <a href="/forgot-password.html" style="font-size:0.875rem;">Forgot password?</a>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="login-btn">Sign In</button>
      </form>

      <div class="auth-footer">
        Don't have an account? <a href="/signup.html">Sign up</a>
      </div>
    </div>
  </div>

  <script src="/js/main.js"></script>
  <script>
    // Redirect if already logged in
    redirectIfLoggedIn('/products.html');

    document.getElementById('login-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const alert = document.getElementById('login-alert');

      clearFieldError('email', 'email-error');
      clearFieldError('password', 'password-error');
      alert.className = 'alert hidden';

      if (!email) {
        setFieldError('email', 'email-error', 'Email is required.');
        return;
      }
      if (!password) {
        setFieldError('password', 'password-error', 'Password is required.');
        return;
      }

      const btn = document.getElementById('login-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Signing In...';

      const { status, data } = await apiRequest('POST', '/auth/login', { email, password });

      btn.disabled = false;
      btn.textContent = 'Sign In';

      if (status === 200 && data.status === 'success') {
        const token = data.data.token;
        // BUG-015: We intentionally do NOT save the user object (firstName/lastName) to localStorage.
        // Only the token is saved here. This means the navbar will show "Account" instead of
        // the user's name until they visit profile.html or trigger a profile fetch.
        // A correct implementation would call: setAuth(token, data.data.user);
        setAuth(token, null); // BUG-015: passing null for user — name won't show in navbar

        // Redirect to intended page or products
        const redirect = getQueryParam('redirect');
        window.location.href = redirect || '/products.html';
        return;
      }

      if (status === 401) {
        alert.className = 'alert alert-error';
        alert.textContent = 'Invalid email or password.';
        alert.classList.remove('hidden');
        return;
      }

      alert.className = 'alert alert-error';
      alert.textContent = data.message || 'Sign in failed. Please try again.';
      alert.classList.remove('hidden');
    });
  </script>
</body>
</html>
