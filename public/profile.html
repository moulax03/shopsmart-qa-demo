<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile — ShopSmart</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <header>
    <nav class="navbar" id="navbar"></nav>
  </header>

  <main class="page-wrapper">
    <div class="container">
      <h1 style="margin-bottom: 1.5rem;">My Profile</h1>

      <div class="profile-layout">
        <!-- Sidebar -->
        <div class="profile-sidebar card">
          <div class="profile-avatar" id="profile-avatar">?</div>
          <div id="profile-name" class="fw-600 mb-1">Loading...</div>
          <div id="profile-email" class="text-muted" style="font-size: 0.8rem; margin-bottom: 1.25rem;"></div>
          <nav class="profile-nav">
            <a href="#profile-info" class="active">Profile Info</a>
            <a href="#change-password">Change Password</a>
            <hr style="border-color: var(--border); margin: 0.5rem 0;" />
            <a href="/orders.html">My Orders</a>
            <a href="#" onclick="logout(); return false;" style="color: var(--error);">Sign Out</a>
          </nav>
        </div>

        <!-- Main Content -->
        <div>
          <!-- Profile Info Section -->
          <div class="card mb-3" id="profile-info">
            <h3 style="margin-bottom: 1.5rem;">Profile Information</h3>
            <div id="profile-alert" class="alert hidden"></div>

            <form id="profile-form" novalidate>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="firstName">First Name <span class="required">*</span></label>
                  <input type="text" id="firstName" class="form-control" />
                  <span class="form-error" id="firstName-error"></span>
                </div>
                <div class="form-group">
                  <label class="form-label" for="lastName">Last Name <span class="required">*</span></label>
                  <input type="text" id="lastName" class="form-control" />
                  <span class="form-error" id="lastName-error"></span>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="email">Email Address</label>
                <input type="email" id="email" class="form-control" disabled style="background: var(--bg); cursor: not-allowed;" />
                <span class="form-hint">Email address cannot be changed.</span>
              </div>
              <div class="form-group">
                <label class="form-label" for="phone">Phone Number</label>
                <input type="text" id="phone" class="form-control" placeholder="+1 (512) 555-0101" />
                <span class="form-error" id="phone-error"></span>
                <!-- BUG-008: Phone validation is completely skipped on both client and server.
                     Any string is accepted — "abc-not-valid", "123", etc. -->
                <span class="form-hint">Any format accepted.</span>
              </div>
              <button type="submit" class="btn btn-primary" id="profile-save-btn">Save Changes</button>
            </form>
          </div>

          <!-- Change Password Section -->
          <div class="card" id="change-password">
            <h3 style="margin-bottom: 1.5rem;">Change Password</h3>
            <div id="pw-alert" class="alert hidden"></div>

            <form id="pw-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="current-password">Current Password <span class="required">*</span></label>
                <input type="password" id="current-password" class="form-control" placeholder="Your current password" autocomplete="current-password" />
                <span class="form-error" id="current-password-error"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="new-password">New Password <span class="required">*</span></label>
                <input type="password" id="new-password" class="form-control" placeholder="Min 8 chars, 1 uppercase, 1 digit, 1 special" autocomplete="new-password" />
                <span class="form-error" id="new-password-error"></span>
              </div>
              <div class="form-group">
                <label class="form-label" for="confirm-new-password">Confirm New Password <span class="required">*</span></label>
                <input type="password" id="confirm-new-password" class="form-control" placeholder="Re-enter new password" autocomplete="new-password" />
                <span class="form-error" id="confirm-new-password-error"></span>
              </div>
              <button type="submit" class="btn btn-primary" id="pw-save-btn">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2024 ShopSmart. All rights reserved.</p>
    </div>
  </footer>

  <script src="/js/main.js"></script>
  <script>
    renderNavbar();
    requireAuth();

    async function loadProfile() {
      const { status, data } = await apiRequest('GET', '/profile', null, true);

      if (status === 401) { window.location.href = '/login.html'; return; }

      if (status !== 200 || !data.data) {
        showToast('Failed to load profile.', 'error');
        return;
      }

      const user = data.data.user;

      // Update sidebar
      const initials = (user.firstName.charAt(0) + user.lastName.charAt(0)).toUpperCase();
      document.getElementById('profile-avatar').textContent = initials;
      document.getElementById('profile-name').textContent = `${user.firstName} ${user.lastName}`;
      document.getElementById('profile-email').textContent = user.email;

      // Populate form
      document.getElementById('firstName').value = user.firstName;
      document.getElementById('lastName').value = user.lastName;
      document.getElementById('email').value = user.email;
      document.getElementById('phone').value = user.phone || '';

      // Also update localStorage with fresh user data (fixes BUG-015 partial)
      setAuth(getToken(), user);
      renderNavbar();
    }

    // Profile form submit
    document.getElementById('profile-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      clearFieldError('firstName', 'firstName-error');
      clearFieldError('lastName', 'lastName-error');

      const firstName = document.getElementById('firstName').value.trim();
      const lastName = document.getElementById('lastName').value.trim();
      const phone = document.getElementById('phone').value;

      let valid = true;
      if (!firstName || firstName.length < 2 || firstName.length > 50 || !/^[a-zA-Z\s\-']+$/.test(firstName)) {
        setFieldError('firstName', 'firstName-error', 'First name must be 2-50 characters (letters, spaces, hyphens, apostrophes).');
        valid = false;
      }
      if (!lastName || lastName.length < 2 || lastName.length > 50 || !/^[a-zA-Z\s\-']+$/.test(lastName)) {
        setFieldError('lastName', 'lastName-error', 'Last name must be 2-50 characters (letters, spaces, hyphens, apostrophes).');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('profile-save-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Saving...';

      // BUG-008: Phone value is sent with no validation — API accepts anything.
      const { status, data } = await apiRequest('PUT', '/profile', { firstName, lastName, phone }, true);

      btn.disabled = false;
      btn.textContent = 'Save Changes';

      const alert = document.getElementById('profile-alert');

      if (status === 200 && data.data) {
        const user = data.data.user;
        // Update localStorage
        setAuth(getToken(), user);
        // Refresh sidebar
        document.getElementById('profile-avatar').textContent = (user.firstName.charAt(0) + user.lastName.charAt(0)).toUpperCase();
        document.getElementById('profile-name').textContent = `${user.firstName} ${user.lastName}`;
        renderNavbar();

        alert.className = 'alert alert-success';
        alert.textContent = 'Profile updated successfully.';
        alert.classList.remove('hidden');
        showToast('Profile saved!', 'success');
        return;
      }

      if (status === 400 && data.errors) {
        if (data.errors.firstName) setFieldError('firstName', 'firstName-error', data.errors.firstName);
        if (data.errors.lastName) setFieldError('lastName', 'lastName-error', data.errors.lastName);
        return;
      }

      alert.className = 'alert alert-error';
      alert.textContent = data.message || 'Failed to update profile.';
      alert.classList.remove('hidden');
    });

    // Change password form submit
    document.getElementById('pw-form').addEventListener('submit', async function (e) {
      e.preventDefault();

      clearFieldError('current-password', 'current-password-error');
      clearFieldError('new-password', 'new-password-error');
      clearFieldError('confirm-new-password', 'confirm-new-password-error');

      const currentPassword = document.getElementById('current-password').value;
      const newPassword = document.getElementById('new-password').value;
      const confirmNewPassword = document.getElementById('confirm-new-password').value;

      let valid = true;
      if (!currentPassword) {
        setFieldError('current-password', 'current-password-error', 'Current password is required.');
        valid = false;
      }
      if (!newPassword || newPassword.length < 8 || !/[A-Z]/.test(newPassword) || !/[0-9]/.test(newPassword) || !/[^a-zA-Z0-9]/.test(newPassword)) {
        setFieldError('new-password', 'new-password-error', 'Password must be at least 8 characters with 1 uppercase, 1 digit, and 1 special character.');
        valid = false;
      }
      if (!confirmNewPassword || newPassword !== confirmNewPassword) {
        setFieldError('confirm-new-password', 'confirm-new-password-error', 'Passwords do not match.');
        valid = false;
      }
      if (!valid) return;

      const btn = document.getElementById('pw-save-btn');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner-inline"></span> Updating...';

      const { status, data } = await apiRequest('POST', '/auth/change-password', { currentPassword, newPassword, confirmNewPassword }, true);

      btn.disabled = false;
      btn.textContent = 'Update Password';

      const alert = document.getElementById('pw-alert');

      if (status === 200) {
        alert.className = 'alert alert-success';
        alert.textContent = 'Password updated successfully.';
        alert.classList.remove('hidden');
        document.getElementById('pw-form').reset();
        showToast('Password changed!', 'success');
        return;
      }

      if (status === 400) {
        if (data.code === 'INVALID_PASSWORD') {
          setFieldError('current-password', 'current-password-error', 'Current password is incorrect.');
        } else {
          alert.className = 'alert alert-error';
          alert.textContent = data.message || 'Failed to update password.';
          alert.classList.remove('hidden');
        }
        return;
      }

      alert.className = 'alert alert-error';
      alert.textContent = data.message || 'An error occurred.';
      alert.classList.remove('hidden');
    });

    loadProfile();
  </script>
</body>
</html>
